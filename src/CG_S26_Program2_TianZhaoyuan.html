<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CG Program 2 - Lights! Camera! Action! - Zhaoyuan Tian</title>
<style>
body    { font-family: Arial, sans-serif; margin: 18px; font-size: 13px; color: #1b2228; }
h1      { font-size: 18px; margin: 0 0 2px; }
.sub    { color: #5a6572; margin: 0 0 12px; font-size: 12px; }
.wrap   { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
canvas  { border: 1px solid #b9c0c7; background: #0d1117; display: block; }
.panel  { width: 290px; }
fieldset{ border: 1px solid #ccd2d8; border-radius: 4px; margin: 0 0 10px; padding: 7px 10px 9px; }
legend  { font-weight: bold; font-size: 12px; padding: 0 4px; }
.row    { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.row label { width: 74px; }
.row input[type=range] { flex: 1; }
.val    { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
button  { font: inherit; padding: 3px 9px; }
</style>
</head>

<body>

<h1>Lights! Camera! Action!</h1>
<div class="wrap">

<canvas id="gl-canvas" width="760" height="560"></canvas>


</div>

<script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es

in vec4 aPosition;

uniform mat4 uModelViewMatrix;
uniform mat4 uProjectionMatrix;

void main()
{
    gl_Position = uProjectionMatrix * uModelViewMatrix * aPosition;
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es

precision mediump float;

uniform vec4 uColor;

out vec4 fColor;

void main()
{
    fColor = uColor;
}
</script>

<script src="MVnew.js"></script>
<script src="initShaders.js"></script>
<script src="CG_S26_Program2_TianZhaoyuan.js"></script>
<script src="CG_S26_Program2_TianZhaoyuan_geometry.js"></script>
</body>
</html>
