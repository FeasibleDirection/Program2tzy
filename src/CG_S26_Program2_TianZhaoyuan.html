<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CG Program 2 - Lights! Camera! Action! - Zhaoyuan Tian</title>
<style>
body    { font-family: Arial, sans-serif; margin: 18px; font-size: 13px; color: #1b2228; }
h1      { font-size: 18px; margin: 0 0 2px; }
.sub    { color: #5a6572; margin: 0 0 12px; font-size: 12px; }
.wrap   { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
canvas  { border: 1px solid #b9c0c7; background: #0d1117; display: block; }
.panel  { width: 290px; }
fieldset{ border: 1px solid #ccd2d8; border-radius: 4px; margin: 0 0 10px; padding: 7px 10px 9px; }
legend  { font-weight: bold; font-size: 12px; padding: 0 4px; }
.row    { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.row label { width: 74px; }
.row input[type=range] { flex: 1; }
.val    { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
button  { font: inherit; padding: 3px 9px; }
</style>
</head>

<body>

<h1>Lights! Camera! Action!</h1>
<div class="wrap">

<canvas id="gl-canvas" width="760" height="560"></canvas>

<div class="panel">

  <fieldset>
    <legend>Action</legend>
    <div class="row"><button id="bWalk">Walk</button><button id="bPose">Reset pose</button></div>
  </fieldset>

  <fieldset>
    <legend>Joints</legend>
    <div class="row"><label>Head</label><input id="sHead" type="range" min="-60" max="60" step="1" value="0"><span class="val" id="vHead">0</span></div>
    <div class="row"><label>L shoulder</label><input id="sLSh" type="range" min="-90" max="90" step="1" value="18"><span class="val" id="vLSh">18</span></div>
    <div class="row"><label>L elbow</label><input id="sLEl" type="range" min="-110" max="0" step="1" value="-25"><span class="val" id="vLEl">-25</span></div>
    <div class="row"><label>R shoulder</label><input id="sRSh" type="range" min="-90" max="90" step="1" value="-18"><span class="val" id="vRSh">-18</span></div>
    <div class="row"><label>R elbow</label><input id="sREl" type="range" min="-110" max="0" step="1" value="-25"><span class="val" id="vREl">-25</span></div>
    <div class="row"><label>L hip</label><input id="sLHip" type="range" min="-60" max="60" step="1" value="-14"><span class="val" id="vLHip">-14</span></div>
    <div class="row"><label>L knee</label><input id="sLKn" type="range" min="0" max="90" step="1" value="12"><span class="val" id="vLKn">12</span></div>
    <div class="row"><label>R hip</label><input id="sRHip" type="range" min="-60" max="60" step="1" value="14"><span class="val" id="vRHip">14</span></div>
    <div class="row"><label>R knee</label><input id="sRKn" type="range" min="0" max="90" step="1" value="12"><span class="val" id="vRKn">12</span></div>
  </fieldset>

  <fieldset>
    <legend>Figure in the scene</legend>
    <div class="row"><label>Move X</label><input id="sPosX" type="range" min="-5" max="5" step="0.05" value="-2"><span class="val" id="vPosX">-2.0</span></div>
    <div class="row"><label>Move Z</label><input id="sPosZ" type="range" min="-5" max="5" step="0.05" value="1.5"><span class="val" id="vPosZ">1.5</span></div>
    <div class="row"><label>Facing</label><input id="sFace" type="range" min="0" max="360" step="1" value="35"><span class="val" id="vFace">35</span></div>
  </fieldset>

  <fieldset>
    <legend>Camera</legend>
    <div class="row"><label>Orbit</label><input id="sOrbit" type="range" min="0" max="360" step="1" value="38"><span class="val" id="vOrbit">38</span></div>
    <div class="row"><label>Height</label><input id="sElev" type="range" min="4" max="70" step="1" value="22"><span class="val" id="vElev">22</span></div>
    <div class="row"><label>Distance</label><input id="sDist" type="range" min="6" max="24" step="0.2" value="13"><span class="val" id="vDist">13.0</span></div>
  </fieldset>

  <fieldset>
    <legend>Sun</legend>
    <div class="row"><label>Direction</label><input id="sSunDir" type="range" min="0" max="360" step="1" value="55"><span class="val" id="vSunDir">55</span></div>
    <div class="row"><label>Height</label><input id="sSunEl" type="range" min="6" max="88" step="1" value="46"><span class="val" id="vSunEl">46</span></div>
    <div class="row"><button id="bSun">Move the sun</button></div>
  </fieldset>

</div>
</div>

<script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es

in vec4 aPosition;
in vec4 aNormal;

uniform mat4 uModelViewMatrix;
uniform mat4 uProjectionMatrix;
uniform mat3 uNormalMatrix;

out vec3 vNormal;
out vec3 vEye;

void main()
{
    vec4 eyePos = uModelViewMatrix * aPosition;

    // the parts of the figure are scaled unevenly, so a normal pushed through
    // the model-view matrix would stop being perpendicular. uNormalMatrix is
    // the inverse transpose, which is the matrix that keeps it perpendicular.
    vNormal = uNormalMatrix * aNormal.xyz;

    // the camera sits at the origin in eye coordinates, so the direction from
    // the surface to the eye is just the negated eye-space position
    vEye = -eyePos.xyz;

    gl_Position = uProjectionMatrix * eyePos;
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es

precision mediump float;

in vec3 vNormal;
in vec3 vEye;

uniform vec4 uColor;
uniform vec3 uLightDir;     // direction toward the sun, in eye coordinates
uniform float uAmbient;
uniform float uShininess;
uniform float uSpecular;

out vec4 fColor;

void main()
{
    vec3 n = normalize(vNormal);
    vec3 l = normalize(uLightDir);
    vec3 e = normalize(vEye);

    // a surface facing away from the camera still has to be lit, otherwise the
    // inside faces of the figure read as black holes
    if (dot(n, e) < 0.0) n = -n;

    float diffuse = max(dot(n, l), 0.0);

    vec3 h = normalize(l + e);
    float spec = pow(max(dot(n, h), 0.0), uShininess) * uSpecular;
    if (diffuse <= 0.0) spec = 0.0;

    vec3 base = uColor.rgb * (uAmbient + (1.0 - uAmbient) * diffuse);
    fColor = vec4(base + vec3(spec), 1.0);
}
</script>
